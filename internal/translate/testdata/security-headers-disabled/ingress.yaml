apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: insecure
  namespace: default
  annotations:
    ingressive.cloud/security-headers: "false"
spec:
  ingressClassName: ingressive
  rules:
    - host: insecure.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 8080
