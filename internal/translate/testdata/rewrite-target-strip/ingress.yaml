apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: rewrite-strip
  namespace: default
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: ingressive
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /legacy
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
