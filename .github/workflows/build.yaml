name: Build and Push

on:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # On a tag like v0.1.0, set VERSION=0.1.0; otherwise dev-<sha>.
      - name: Compute version
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
            echo "is_tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
            echo "is_tag=false" >> "$GITHUB_OUTPUT"
          fi

      # On tag: image tags include the version. On main: latest + sha only.
      - name: Compute image tags
        id: tags
        run: |
          tags="ghcr.io/ingressive-cloud/controller:latest"
          tags="$tags,ghcr.io/ingressive-cloud/controller:sha-${GITHUB_SHA}"
          if [[ "${{ steps.version.outputs.is_tag }}" == "true" ]]; then
            tags="$tags,ghcr.io/ingressive-cloud/controller:${{ steps.version.outputs.version }}"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}

      # Helm chart push only happens on a tag. The chart's version is rewritten
      # to match the tag so users install with --version <tag>.
      - name: Package and push Helm chart
        if: steps.version.outputs.is_tag == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # Rewrite Chart.yaml so version + appVersion match the tag; idempotent.
          sed -i -E "s/^version: .*/version: ${VERSION}/" helm/ingressive-controller/Chart.yaml
          sed -i -E "s/^appVersion: .*/appVersion: \"${VERSION}\"/" helm/ingressive-controller/Chart.yaml
          helm package helm/ingressive-controller --destination .
          # Log helm in via OCI; same GHCR token we already have.
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin
          helm push "ingressive-controller-${VERSION}.tgz" oci://ghcr.io/ingressive-cloud/controller/chart
