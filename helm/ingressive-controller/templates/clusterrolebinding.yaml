{{- /*
  Binds the cluster-scoped Ingress-watch permissions (clusterrole.yaml) to the
  controller's ServiceAccount. The ServiceAccount itself lives in the install
  namespace; the binding is cluster-scoped because the ClusterRole is.
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "ingressive-controller.fullname" . }}-cluster
  labels:
    {{- include "ingressive-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "ingressive-controller.fullname" . }}-cluster
subjects:
  - kind: ServiceAccount
    name: {{ include "ingressive-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
