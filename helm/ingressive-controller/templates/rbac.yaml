{{- /*
  Namespace-scoped Role granting the controller permission to manage its
  paired Connector Secret and Deployment. The pod-lookup verb is needed only
  for owner-reference resolution (Pod -> ReplicaSet -> Deployment).
*/}}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "ingressive-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingressive-controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "ingressive-controller.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "ingressive-controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "ingressive-controller.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "ingressive-controller.fullname" . }}
    namespace: {{ .Release.Namespace }}
